  --paper:#F8F3E5; --card:#FFFCF3; --ink:#0F4F3A; --muted:#55705F; --line:#E4DAC2;

  --grid:transparent; --shade:rgba(70,52,10,.10); --board:#0F4F3A; --board-fg:#F8F3E5;
  --display:"Hit and Run","Arial Black",system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"Sackers","Copperplate","Century Gothic",ui-sans-serif,sans-serif;
  --thin:"Sackers","Copperplate","Century Gothic",ui-sans-serif,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}

body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
  }
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 72px}
h1,h2,h3{font-family:var(--display);font-weight:400;font-synthesis:none;text-wrap:balance;margin:0;line-height:1;letter-spacing:.01em}
body{font-synthesis:none}
h1,h2{text-transform:uppercase}
.spark{display:inline-block;width:.8em;height:.8em;background:var(--brass);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);vertical-align:middle}
.eyebrow{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hand{font-family:var(--hand);color:var(--pencil);font-size:22px;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* topo + hero */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:64px}
.hero .kicker{font:500 13px/1.5 var(--thin);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.hero h1{font-size:clamp(46px,7vw,92px);margin-top:14px}
.hero .bigdate{font:300 clamp(58px,9.5vw,124px)/1 var(--thin);letter-spacing:.02em;margin:14px 0 4px;color:var(--ink)}
.hero .sub{font:400 clamp(15px,1.6vw,19px)/1.4 var(--thin);letter-spacing:.14em;text-transform:uppercase}
.hero .lede{max-width:48ch;color:var(--muted);font-size:17.5px;margin:22px 0 0}
.facts{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px;border-left:3px solid var(--brass);padding-left:16px}
.facts li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline;font:500 13px/1.5 var(--thin);letter-spacing:.05em;text-transform:uppercase}
.facts span{font:300 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero .hand{display:block;margin-top:18px;transform:rotate(-1.5deg)}
.illo{position:relative;margin:0;max-width:520px;justify-self:center;width:100%}
.illo img{width:100%;height:auto;display:block;-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 78%,transparent 100%)}
.illo .curve{position:absolute;left:-4%;top:34%;width:46%;overflow:visible;pointer-events:none}
.illo .curve text{font:500 13px var(--thin);letter-spacing:.22em;fill:var(--ink);text-transform:uppercase}
.keytag{position:absolute;right:2%;bottom:6%;width:118px;height:118px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-content:center;text-align:center;box-shadow:0 10px 24px var(--shade);transform:rotate(8deg);animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
.keytag .k-label{font:500 10px var(--thin);letter-spacing:.14em;text-transform:uppercase}
.keytag .k-num{font:300 40px/1 var(--thin);margin:4px 0 0;font-variant-numeric:tabular-nums}
.keytag .k-sub{font:500 10px var(--thin);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.coverbtn{position:absolute;right:12px;bottom:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:500 12px var(--mono);cursor:pointer}
.coverbtn input,.addph input{position:absolute;width:1px;height:1px;opacity:0}

/* sumário: quadro de andares do prédio */
.directory{margin:0 0 88px;background:var(--board);color:var(--board-fg);border-radius:10px;padding:22px 24px;box-shadow:0 14px 30px var(--shade)}
.directory .d-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-bottom:12px}
.directory ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.directory button{width:100%;text-align:left;background:transparent;color:inherit;border:1.5px solid color-mix(in srgb,var(--board-fg) 30%,transparent);border-radius:6px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;transition:background .2s,border-color .2s}
.directory button:hover{background:color-mix(in srgb,var(--board-fg) 10%,transparent);border-color:var(--lit)}
.directory .fl{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lit)}
.directory .nm{font:400 22px/1.1 var(--display);text-transform:uppercase}
.directory .ds{font-size:13.5px;opacity:.75}

/* história: o prédio */
.story{display:grid;grid-template-columns:200px 1fr;gap:48px;margin-bottom:96px;scroll-margin-top:20px}
#presentes,#vales{scroll-margin-top:20px}
.story-head{grid-column:1/-1}
.story-head h2{font-size:clamp(36px,5.4vw,64px);margin-top:12px}
.story-head .hand{display:block;margin-top:6px}
.building{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
.building svg{width:100%;height:auto;display:block}
.building .cap{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:10px}
.floors{display:grid;gap:0;min-width:0}
.floor{position:relative;padding:24px 0 24px 28px;border-left:2px solid var(--line);min-width:0}
.floor::before{content:"";position:absolute;left:-8px;top:32px;width:14px;height:14px;border-radius:3px;background:var(--paper);border:2px solid var(--line);transition:background .4s,border-color .4s}
.floor.lit::before{background:var(--lit);border-color:var(--brass)}
.floor .andar{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.floor .date-big{display:block;font:300 clamp(22px,2.8vw,32px)/1.15 var(--thin);letter-spacing:.02em;margin:8px 0 4px}
.floor .date-small{font:500 12px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.04em;text-transform:none}
.floor h3{font:800 17px/1.3 var(--thin);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 14px}
.floor.key .date-big{display:inline-block;background:var(--lit);color:var(--brass-ink);padding:2px 12px;border-radius:6px;transform:rotate(-1.5deg)}
.floor p{margin:0 0 14px;font-size:17.5px;max-width:62ch}
.floor p:last-of-type{margin-bottom:0}
.floor .first-p::first-letter{font-family:var(--display);font-weight:400;font-size:3.1em;float:left;line-height:.9;margin:6px 10px 0 0;color:var(--brass)}
.pull{font:300 clamp(22px,2.6vw,30px)/1.3 var(--thin);margin:22px 0 4px;max-width:30ch;padding-left:16px;border-left:3px solid var(--brass)}
.wait{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.wait span{font:500 13px var(--mono);border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px;font-variant-numeric:tabular-nums}
.wait b{font:300 24px/1 var(--thin);margin-right:6px}

/* galeria */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.ph{margin:0;position:relative;display:grid;gap:6px;min-width:0;background:var(--card);padding:8px 8px 10px;box-shadow:0 6px 16px var(--shade)}
.ph:nth-child(odd){transform:rotate(-1.4deg)} .ph:nth-child(even){transform:rotate(1.2deg)}
.ph button.open{padding:0;border:0;background:var(--paper);overflow:hidden;cursor:zoom-in;aspect-ratio:1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{font-family:var(--hand);font-size:19px;line-height:1.1;color:var(--pencil);text-align:center}
.ph input[type=text]{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--paper);width:100%}
.ph .rm{position:absolute;top:12px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;font:500 11px var(--mono);padding:3px 6px;cursor:pointer}
.addph{display:grid;place-items:center;text-align:center;aspect-ratio:1;border:1.5px dashed var(--line);color:var(--muted);font:500 12px var(--mono);cursor:pointer;padding:8px;position:relative;background:transparent}
.slot{display:grid;place-items:center;text-align:center;aspect-ratio:1;border:1.5px dashed var(--line);color:var(--muted);font-family:var(--hand);font-size:20px;padding:8px}
.big-photo{width:100%;max-height:70vh;object-fit:contain;background:var(--paper)}

/* planta */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(36px,5.4vw,64px);margin-top:12px}
.sec-head p{max-width:46ch;margin:10px 0 0;color:var(--muted)}
.rules{display:inline-grid;gap:2px;margin:0 0 22px;padding:12px 18px;border:2.5px solid var(--brass);border-radius:6px;transform:rotate(-1.2deg);font-size:17px;background:var(--card)}
.rules b{font-family:var(--thin);font-weight:800}
.manual{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 26px;padding:14px 18px;list-style:none;border:1.5px solid var(--ink);border-radius:6px;font-size:15px;background:var(--card)}
.manual li{display:flex;gap:8px;align-items:baseline}
.manual b{font:500 12px var(--mono);color:var(--muted)}
.plan-wrap{position:relative;margin-bottom:12px}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 10px 24px var(--shade)}
.plan svg{width:100%;height:auto;display:block}
.plan .floor-bg{fill:var(--paper)}
.plan .furn *{fill:none;stroke:var(--line);stroke-width:2}
.plan .walls polygon{fill:none;stroke:var(--ink);stroke-width:16;stroke-linejoin:miter}
.plan .walls path{fill:none;stroke:var(--ink);stroke-width:8}
.plan .walls .glass{stroke:var(--card);stroke-width:12}
.rz{cursor:pointer;outline:none}
.rz .hit{fill:transparent;transition:fill .25s}
.rz:hover .hit{fill:var(--grid)}
.rz:focus-visible .hit{stroke:var(--brass);stroke-width:6}
.rz[aria-pressed="true"] .hit{fill:var(--lit);opacity:.85}
.rz text{fill:var(--ink)}
.rz .t-name{font:800 17px var(--mono);letter-spacing:.08em}
.rz .t-count{font:300 22px var(--thin)}
.rz .t-note{font:500 25px var(--hand);fill:var(--pencil)}
.rz .t-dim{font:400 15px var(--mono);fill:var(--muted)}
.rz.done .t-count{text-decoration:line-through;opacity:.55}
.rz[aria-pressed="true"] text{fill:var(--brass-ink)}
.chip{font-variant-numeric:tabular-nums}
.plan-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted);margin-top:10px}
.plan-foot button{background:none;border:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.bands{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.band{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:500 11px var(--thin);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.band[aria-pressed="true"]{background:var(--lit);border-color:var(--brass);color:var(--brass-ink)}
.tag .thumb{margin:-6px -4px 2px -24px;aspect-ratio:4/3;background:var(--paper);border-radius:6px;overflow:hidden;display:grid;place-items:center}
.tag .thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.tag .buy{font:600 13.5px var(--body);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.tag .acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.part{font:500 11px var(--mono);letter-spacing:.06em;color:var(--ok);text-transform:uppercase}
.extra-rooms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--ink);border-radius:3px;padding:6px 10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* etiquetas de presente */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:26px}
.tag{position:relative;background:var(--card);border-radius:6px 6px 6px 28px;padding:22px 20px 20px 44px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 1px 0 var(--line),0 10px 24px var(--shade)}
.tag::before{content:"";position:absolute;left:16px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 3px var(--shade)}
.tag::after{content:"";position:absolute;left:21px;top:36px;bottom:24px;border-left:1.5px dashed var(--line)}
.tag .meta{display:flex;justify-content:space-between;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tag h3{font:500 14px/1.4 var(--thin);letter-spacing:.04em;text-transform:uppercase}
.tag .spec{font-size:14.5px;color:var(--muted);margin:0;flex:1}
.tag .price{font:300 24px var(--thin);font-variant-numeric:tabular-nums}
.tag .price small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;margin-left:4px}
.taken{opacity:.6}
.stamp{position:absolute;top:16px;right:14px;border:2.5px solid var(--ok);color:var(--ok);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:4px;transform:rotate(8deg);background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:12px 16px;font:500 12.5px/1.2 var(--thin);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.brass{background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:28px;border:1.5px dashed var(--line);color:var(--muted);text-align:center;grid-column:1/-1;font-family:var(--hand);font-size:22px}

/* vales */
.cotas{margin-top:96px}
.vales{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:26px}
.vale{position:relative;display:grid;grid-template-columns:1fr 104px;background:var(--card);border-radius:8px;min-width:0;box-shadow:0 10px 24px var(--shade);
  -webkit-mask:radial-gradient(circle 10px at calc(100% - 104px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at calc(100% - 104px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 10px at calc(100% - 104px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at calc(100% - 104px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.vale .v-main{padding:18px 18px 18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vale .v-main .eyebrow{font-size:10.5px}
.vale h3{font:400 20px/1.15 var(--display);text-transform:uppercase}
.vale p{margin:0;font-size:14.5px;color:var(--muted);flex:1}
.vale .stub{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 8px;background:var(--lit);color:var(--brass-ink);text-align:center}
.vale .stub .v{font:500 19px/1 var(--thin);font-variant-numeric:tabular-nums}
.vale .stub small{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.vale .stub button{background:var(--brass-ink);color:var(--lit);border:0;border-radius:5px;font:700 13px var(--body);padding:8px 10px;cursor:pointer}
.vale.paw .stub{background:var(--brass)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,32,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:30}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--card);border-radius:12px;max-width:520px;width:100%;max-height:calc(100% - 16px);overflow:auto;padding:24px;display:grid;gap:16px}
.modal h3{font-size:28px;text-transform:uppercase}
.x{justify-self:end;background:none;border:0;font:500 12px var(--mono);color:var(--muted);cursor:pointer;margin-bottom:-12px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{border:1.5px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:grid;gap:4px}
.choice label:has(input:checked){border-color:var(--ink);background:var(--paper)}
.choice input{accent-color:var(--ink)}
.choice small{color:var(--muted);font-size:13px}
.specbox{background:var(--paper);border-radius:8px;padding:14px 16px;display:grid;gap:6px;border:1.5px dashed var(--line)}
.specbox strong{font:700 17px var(--body)}
.warn{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600}
.warn input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink);flex:none}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);width:100%}
.field textarea{min-height:84px;resize:vertical}
.code{font:13px/1.4 var(--mono);word-break:break-all;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:96px;overflow:auto}
.note{font-size:13px;color:var(--muted);margin:0}
.done{display:grid;gap:10px;justify-items:center;text-align:center;padding:6px 0}
.done svg{width:84px;height:84px;animation:turn .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes turn{from{transform:rotate(-90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.done .big{font:400 28px var(--display);text-transform:uppercase}

/* anfitriã */
.adminbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brass);color:var(--brass-ink);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:24px;font-size:14px;font-weight:600}
.adminbar .btn{padding:8px 12px;font-size:14px}
.adminbar .btn.main{background:var(--brass-ink);color:var(--brass)}
.adminbar .btn.ghost{border-color:var(--brass-ink);color:var(--brass-ink)}
.edit{position:absolute;bottom:12px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;font:500 11px var(--mono);padding:4px 8px;cursor:pointer;color:var(--muted)}
.vale .edit{bottom:auto;top:10px;right:114px}
.who{font-size:13px;color:var(--ok);font-weight:700}
.hostbtn{background:none;border:1px dashed var(--line);border-radius:4px;padding:6px 10px;font:500 12px var(--mono);color:var(--muted);cursor:pointer}
footer{margin-top:96px;padding-top:22px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer .paws{font-family:var(--hand);font-size:24px;color:var(--pencil)}

@media (max-width:820px){
  .rz .t-note,.rz .t-dim{display:none}
  .plan{padding:6px}
  .hero{grid-template-columns:1fr;gap:28px}
  .illo{max-width:400px;order:-1}
  .directory ol{grid-template-columns:1fr}
  .story{grid-template-columns:1fr;gap:12px}
  .building{display:none}
}

<script type="application/json" id="data">{"config": {"couple": "Letícia, Gui e Lasanha", "title": "A casa nova da Letícia e do Gui", "intro": "Depois de 3 anos, 5 meses e 30 dias de espera, a chave chegou. No sábado, 19 de dezembro, vamos abrir as portas do apê pela primeira vez pra quem fez parte dessa história, comemorar o meu aniversário e apresentar o Lasanha pra quem ainda não conhece. Vem com a gente!", "date": "19 de dezembro, sábado", "place": "Nosso apê novo (endereço em breve)", "pixKey": "", "pixName": "", "pixCity": "", "whatsapp": "", "chapters": [{"date": "26 de março de 2023", "title": "O dia do stand", "gallery": "", "key": false, "minor": false, "text": "Fui e voltei naquele stand não sei quantas vezes. Olhava a planta, fazia conta, desistia, voltava atrás. A dúvida era do tamanho do apartamento.\n\nMeus pais estavam lá comigo, como sempre, e seguiram do meu lado em todos os dias depois, inclusive nos difíceis. No fim daquele domingo, eu assinei. Pai, mãe: essa casa também é de vocês. 🤍"}, {"date": "No meio do caminho", "title": "Uma cantada boba", "gallery": "", "key": false, "minor": true, "text": "Eu achava que estava comprando a minha independência: morar sozinha, do meu jeito. A vida tinha outros planos.\n\nNa fase mais bagunçada da minha vida, chegou uma mensagem do Gui com uma cantada boba. Nem liguei. Mas a conversa foi pegando ritmo, e quando vi eu já estava esperando o celular vibrar."}, {"date": "18 de setembro e 2 de novembro de 2024", "title": "O beijo e o namoro", "gallery": "", "key": false, "minor": true, "text": "Depois de tanta conversa, veio o primeiro beijo e, com ele, uma calma que eu não sentia havia muito tempo. Pouco mais de um mês depois, o pedido de namoro. Sem eu perceber, o plano de morar sozinha virou o plano de morar com ele."}, {"date": "3 de novembro de 2025", "title": "O pedido de noivado", "gallery": "", "key": false, "minor": true, "text": "Um ano e um dia depois, já morando juntos, veio o pedido de noivado. Parece rápido, mas com o Gui nunca pareceu pressa. Pareceu reencontro, como se a gente já se conhecesse de outras vidas."}, {"date": "3 anos, 5 meses e 30 dias", "title": "A espera", "gallery": "obra", "key": false, "minor": false, "text": "Enquanto a nossa história andava rápido, a obra andava no ritmo dela: visitas e mais visitas, o prédio subindo andar por andar e um \"falta pouco\" que nunca chegava."}, {"date": "25 de setembro de 2026, 9h", "title": "A chave", "gallery": "", "key": true, "minor": false, "text": "Numa sexta-feira de setembro, às 9h, a chave veio parar na minha mão. ✨ O apê estava vazio, só paredes e eco. Mesmo assim, no primeiro passo lá dentro, eu me senti em casa. Todo o perrengue valeu a pena."}, {"date": "Agora", "title": "Hoje, uma família", "gallery": "familia", "key": false, "minor": false, "text": "Gui, obrigada por ter chegado bem na hora em que eu mais precisava, mesmo eu achando que não era a hora certa. Era. Você era.\n\nHoje a gente é uma família: eu, o Gui e o Lasanha, aqui no 7º andar. 🐶 E queremos você com a gente no dia 19 pra conhecer o apê, conhecer o Lasanha e brindar o meu aniversário."}], "giftNote": "Presente não é obrigatório, de verdade. Obrigatória mesmo é a sua presença (essa a gente cobra). Mas, se quiser mimar a casa nova, montamos uma lista bem pensada: dá pra levar no dia ou mandar por Pix.", "time": "Horário a confirmar", "eventDate": "2026-12-19", "birthday": true}, "gifts": [{"id": "g1", "kind": "item", "room": "Cozinha", "name": "Panela de pressão Tramontina Vancouver Effect 4,5 L", "spec": "Tramontina Vancouver Effect, ref. 20591-720, 4,5 litros, cor vermelha.", "price": 177.22, "link": "https://www.mercadolivre.com.br/panela-de-pressao-45l-tramontina-vancouver-effect-20591-720-cor-vermelho/p/MLB42501702?pdp_filters=item_id%3AMLB5456370676", "status": "livre", "by": "", "mode": "", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3Nw function directory(items,cotas){
  const free=items.filter(g=>g.status==='livre').length, N=C().chapters.length;
  const rows=[
    ['historia','1º ao '+N+'º andar','A nossa história',N+' capítulos curtinhos, do stand até o 7º andar'],
    ['presentes','Planta do apê','Lista de presentes',free+' presentes disponíveis, pra levar ou mandar Pix'],
    ['vales','Cobertura','Vales pra vida nova',cotas.length+' momentos pra presentear por Pix']];
  return `<nav class="directory" aria-label="Sumário"><div class="d-head"><span>Sumário · quadro de andares</span><span>toque pra subir</span></div>
    <ol>${rows.map(r=>`<li><button data-go="${r[0]}"><span class="fl">${r[1]}</span><span class="nm">${r[2]}</span><span class="ds">${r[3]}</span></button></li>`).join('')}</ol></nav>`;
}
function cover(){
  const p=(state.photos.capa||[])[0];
  const up=`<input type="file" accept="image/*" id="up-capa" data-up="capa">`;
  if(p) return `<span class="tape"></span><figure class="cover"><img src="${p.src}" alt="Letícia, Gui e Lasanha">${canUp()?`<label class="coverbtn">Trocar foto de capa${up}</label>`:''}</figure>`;
  return `<span class="tape"></span><div class="cover empty">${canUp()?`<label class="coverbtn big">+ Foto de capa: você, o Gui e o Lasanha${up}</label>`:'<span>foto em breve</span>'}</div>`;
}

function story(){
  const ch=C().chapters, N=ch.length;
  const floorsSvg=buildingSvg(N);
  return `<section class="story" id="historia" aria-labelledby="h-story">
    <div class="story-head"><span class="eyebrow"><span class="spark"></span>&nbsp; Como chegamos até aqui</span><h2 id="h-story">A nossa história</h2><span class="hand">do stand até o 7º andar, sobe com a gente</span></div>
    <div class="building" aria-hidden="true">${floorsSvg}<div class="cap">${N} andares · o nosso é o último</div></div>
    <div class="floors">${ch.map((x,i)=>{
      const extra = x.gallery==='obra' ? `<div class="wait"><span><b>3</b>anos</span><span><b>5</b>meses</span><span><b>30</b>dias</span></div>` : '';
      const pull='';
      return `<article class="floor ${x.key?'key':''}" data-floor="${i}">
        <span class="andar">${i+1}º andar${i===N-1?' · é aqui':''}${x.minor?`<span class="date-small">${esc(x.date)}</span>`:''}</span>
        ${x.minor?'':`<span class="date-big">${esc(x.date)}</span>`}
        <h3>${esc(x.title)}</h3>${extra}${paras(x.text,i===0)}${pull}${x.gallery?gallery(x.gallery):''}
      </article>`}).join('')}</div>
  </section>`;
}
function buildingSvg(N){
  const fh=34, w=150, top=40, H=top+N*fh+20;
  let s=`<svg viewBox="0 0 200 ${H}" role="img"><g fill="none" stroke="var(--ink)" stroke-width="2.5">`;
  s+=`<g class="crane" stroke="var(--muted)" stroke-width="2"><path d="M150 ${top} V6 M110 10 H190 M150 6 L120 10 M150 6 L185 10 M180 10 V26"/></g>`;
  s+=`<rect x="25" y="${top}" width="${w}" height="${N*fh}" fill="var(--card)"/>`;
  for(let i=0;i<N;i++){
    const y=top+(N-1-i)*fh; s+=`<line x1="25" x2="175" y1="${y}" y2="${y}" stroke-width="1.2" stroke="var(--line)"/>`;
    for(let k=0;k<3;k++){const x=40+k*44;
      s+= i===0&&k===1 ? `<rect class="win" data-f="${i}" x="${x+6}" y="${y+8}" width="22" height="${fh-8}" fill="var(--paper)" stroke-width="1.5"/>` : `<rect class="win" data-f="${i}" x="${x}" y="${y+9}" width="34" height="16" rx="1.5" fill="var(--paper)" stroke-width="1.5"/>`;}
  }
  s+=`<line x1="5" x2="195" y1="${top+N*fh}" y2="${top+N*fh}" stroke-width="3"/></g></svg>`;
  return s;
}
let io;
function observeFloors(){
  if(io) io.disconnect();
  const floors=[...root.querySelectorAll('.floor')]; if(!('IntersectionObserver' in window)){floors.forEach(f=>light(f));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)light(e.target)}),{rootMargin:'0px 0px -35% 0px'});
  floors.forEach(f=>{if(lit.has(f.dataset.floor))light(f);else io.observe(f)});
}
const lit=new Set();
function light(f){
  const i=f.dataset.floor; lit.add(i); f.classList.add('lit');
  root.querySelectorAll(`.win[data-f="${i}"]`).forEach(w=>{w.setAttribute('fill','var(--lit)');w.style.transition='fill .5s'});
  const key=C().chapters.findIndex(c=>c.key); if(key>=0&&lit.has(String(key))){const cr=root.querySelector('.crane');if(cr)cr.style.opacity='0'}
}

const GLABEL={obra:'Fotos da obra',familia:'Fotos da família',capa:'Foto de capa'};
function gallery(key){
  const ps=state.photos[key]||[];
  if(!ps.length&&!canUp()) return `<div class="gallery">${['em breve','fotos','aqui'].map(t=>`<div class="slot">${t}</div>`).join('')}</div>`;
  return `<div class="gallery" aria-label="${GLABEL[key]}">${ps.map(p=>`<figure class="ph">
    <button class="open" data-a="photo" data-g="${key}" data-id="${p.id}" aria-label="Ampliar foto"><img src="${p.src}" alt="${esc(p.caption||GLABEL[key])}" loading="lazy"></button>
    ${canUp()?`<input type="text" id="cap-${p.id}" data-cap="${key}|${p.id}" value="${esc(p.caption)}" placeholder="Legenda"><button class="rm" data-a="rm-photo" data-g="${key}" data-id="${p.id}">remover</button>`:(p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:'')}
  </figure>`).join('')}
  ${canUp()?`<label class="addph">+ ${GLABEL[key]}<input type="file" accept="image/*" multiple id="up-${key}" data-up="${key}"></label>`:''}</div>`;
}

function plan(items){
  const free=r=>items.filter(g=>g.room===r&&g.status==='livre').length;
  const total=r=>items.filter(g=>g.room===r).length;
  const label=r=>{const f=free(r),t=total(r);return t?(f?`${f} ${f===1?'presente':'presentes'}`:'tudo escolhido'):'nada por aqui ainda'};
  const zone=(p)=>{const on=filter===p.room;return `<g class="rz ${total(p.room)&&!free(p.room)?'done':''}" data-room="${p.room}" role="button" tabindex="0" aria-pressed="${on}" aria-label="${p.room}: ${label(p.room)}">
    <polygon class="hit" points="${p.pts}"/>
    <text x="${p.tx}" y="${p.ty}" class="t-name">${p.room.toUpperCase()}</text>
    <text x="${p.tx}" y="${p.ty+(p.small?0:32)}" class="t-count" ${p.small?`dx="${p.room.length*14+12}"`:''}>${label(p.room)}</text>
    ${p.small||p.nonote?'':`<text x="${p.tx}" y="${p.ty+60}" class="t-note">${p.note}</text>`}
    <text x="${p.dx}" y="${p.dy}" class="t-dim">${p.dim}</text>
  </g>`};
  const extra=ROOMS.filter(r=>!PLAN.some(p=>p.room===r)&&total(r));
  return `<div class="plan-wrap">
  <div class="plan"><svg viewBox="-10 -10 1060 800" role="group" aria-label="Planta do apê: escolha um cômodo">
    <polygon class="floor-bg" points="0,115 678,115 678,3 1038,3 1038,455 915,455 915,735 580,735 580,775 233,775 233,683 0,683"/>
    <g class="furn">

/* ---------- fotos ---------- */
async function shrink(file,maxSide){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=maxSide||1400,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',0.8)}finally{URL.revokeObjectURL(url)}
}
function markDirty(){if(dirty)return;dirty=true;const s=document.querySelector('.adminbar span');if(s)s.textContent='Modo anfitriã · alterações não publicadas';const b=document.querySelector('[data-a="publish"]');if(b)b.disabled=false}

/* ---------- eventos ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
root.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');
  if(go){const el=document.getElementById(go.dataset.go);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
  const t=e.target.closest('[data-a],[data-room],[data-band]'); if(!t) return;
  if(t.dataset.band){band=t.dataset.band;render();return}
  if(t.dataset.room){filter=(filter===t.dataset.room&&t.dataset.room!=='Todos')?'Todos':t.dataset.room;render();return}
  const a=t.dataset.a;
  if(a==='close-scrim'&&e.target!==t) return;
  if(a==='close'||a==='close-scrim'){modal=null;render();return}
  if(a==='pick'){modal={type:'pick',id:t.dataset.id,name:'',mode:gift(t.dataset.id).kind==='cota'?'pix':'',agree:false,free:'',step:'form'};render();const el=document.getElementById('g-name');if(el)el.focus();return}
  if(a==='confirm'){modal.step='done';render();return}
  if(a==='copy'){const el=document.getElementById(t.dataset.target);try{await navigator.clipboard.writeText(el.textContent);t.textContent='Copiado!'}catch(_){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Selecionado, copie'}return}
  if(a==='admin'){admin=true;render();return}
  if(a==='exit'){admin=false;render();return}
  if(a==='new'){modal={type:'edit',isNew:true,draft:{id:'n'+Date.now().toString(36),kind:'item',room:'Cozinha',name:'',spec:'',price:0,link:'',status:'livre',by:'',mode:''}};render();return}
  if(a==='edit'){modal={type:'edit',draft:{...gift(t.dataset.id)}};render();return}
  if(a==='save-gift'){readEdit();const d=modal.draft;if(!d.name.trim())return;const i=state.gifts.findIndex(g=>g.id===d.id);if(i>=0)state.gifts[i]=d;else state.gifts.push(d);dirty=true;modal=null;render();return}
  if(a==='del-gift'){if(!modal.confirmDel){modal.confirmDel=true;render();return}state.gifts=state.gifts.filter(g=>g.id!==modal.draft.id);dirty=true;modal=null;render();return}
  if(a==='settings'){modal={type:'settings',draft:JSON.parse(JSON.stringify(state.config))};render();return}
  if(a==='save-settings'){const d=modal.draft;['couple','title','intro','giftNote','date','time','place'].forEach(k=>d[k]=val('s-'+k));d.chapters.forEach((ch,i)=>{ch.date=val(`s-ch${i}d`);ch.title=val(`s-ch${i}t`);ch.text=val(`s-ch${i}x`)});d.pixKey=val('s-key');d.pixName=val('s-pname');d.pixCity=val('s-pcity');d.whatsapp=val('s-wa');state.config=d;dirty=true;modal=null;render();return}
  if(a==='publish'){await publish(t);return}
  if(a==='photo'){modal={type:'photo',g:t.dataset.g,id:t.dataset.id};render();return}
  if(a==='rm-photo'){state.photos[t.dataset.g]=state.photos[t.dataset.g].filter(p=>p.id!==t.dataset.id);dirty=true;admin=true;render();return}
});
function readEdit(){const d=modal.draft;const k=val('e-kind');if(k)d.kind=k;if(document.getElementById('e-room'))d.room=val('e-room');if(d.kind==='cota')d.room='Cotas';d.name=val('e-name');d.spec=val('e-spec');d.price=parseFloat(String(val('e-price')).replace(',','.'))||0;d.link=val('e-link');d.status=val('e-status')||'livre';d.by=val('e-by');d.mode=val('e-mode');d.repeat=d.kind==='cota'}
root.addEventListener('input',e=>{

  if(k){const [g,id]=k.split('|');const p=state.photos[g].find(x=>x.id===id);if(p){p.caption=e.target.value;if(!admin){admin=true;dirty=true;render();const el=document.getElementById(e.target.id);if(el){el.focus()}}else markDirty()}return}
  if(!modal||modal.type!=='pick') return;
  const id=e.target.id;
  if(id==='g-name'||id==='g-free'){if(id==='g-name')modal.name=e.target.value;else modal.free=e.target.value.replace(',','.');const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
});
root.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='only-free'){onlyFree=t.checked;render();return}
  if(t.dataset&&t.dataset.gimg&&modal&&modal.type==='edit'){const f=t.files[0];if(f){readEdit();try{modal.draft.img=await shrink(f,500)}catch(_){}render()}return}
  if(t.dataset&&t.dataset.up){
    const key=t.dataset.up, files=[...t.files]; if(!files.length) return;
    state.photos[key]=state.photos[key]||[];
    if(key==='capa'){try{state.photos.capa=[{id:'cover'+Date.now().toString(36),src:await shrink(files[0],2000),caption:''}]}catch(_){}}
    else for(const f of files){try{state.photos[key].push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:await shrink(f),caption:''})}catch(_){}}
    dirty=true;admin=true;render();return;
  }
  if(!modal) return;
  if(modal.type==='pick'){
    if(t.name==='mode'){modal.mode=t.value;modal.agree=false;render()}
    if(t.id==='agree'){modal.agree=t.checked;render()}
  }
  if(modal.type==='edit'&&t.id==='e-kind'){readEdit();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal){modal=null;render()}
  const rz=e.target.closest&&e.target.closest('.rz');
  if(rz&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const r=rz.dataset.room;filter=filter===r?'Todos':r;render();const n=root.querySelector(`.rz[data-room="${r}"]`);if(n)n.focus()}

/* ---------- publicar ---------- */
async function publish(btn){
  if(!artifactNs){btn.textContent='Sem permissão pra publicar';return}
  btn.disabled=true;btn.textContent='Publicando…';
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const head=document.querySelector('title').outerHTML+[...document.querySelectorAll('link[rel]')].map(l=>l.outerHTML).join('');
  const html=SKELETON_HEAD+head+'<style id="st">'+document.getElementById('st').textContent+'</style><div id="root"></div><script type="application/json" id="data">'+json+'<\/script><script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';
  try{await artifactNs.publish(html);dirty=false;btn.textContent='Publicado'}
  catch(err){btn.disabled=false;btn.textContent=err&&err.code==='conflict'?'Outra versão foi salva, recarregando':'Não deu pra publicar, tente de novo'}
}

render();
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{const user=await window.claude.use('user');isOwner=user?await user.isOwner():false;if(isOwner)artifactNs=await window.claude.use('artifact');render()}catch(_){}
})();
